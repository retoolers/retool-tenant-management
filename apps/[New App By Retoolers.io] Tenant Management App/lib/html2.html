<span class="notification-bell" data-click-target="bell" style="position: relative; display: inline-block; padding: 8px 8px;">
  <!-- Bell icon: size depends on whether badge is shown -->
  <svg 
    xmlns="http://www.w3.org/2000/svg"
    width="{{ notifcations.value.filter(n => n.state === 'Active').length > 0 ? 18 : 26 }}"
    height="{{ notifcations.value.filter(n => n.state === 'Active').length > 0 ? 18 : 26 }}"
    viewBox="0 0 24 24" fill="none" stroke="#f5f6f7" stroke-width="2.2"
    stroke-linecap="round" stroke-linejoin="round"
    style="display: block;"
  >
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
  </svg>
  <!-- Badge only if count > 0 -->
  {{
    notifcations.value.filter(n => n.state === "Active").length > 0
      ? `<span class="badge" style='position: absolute; top: 0px; right: -4px; min-width:18px; height:18px; line-height:18px;'>${notifcations.value.filter(n => n.state === "Active").length}</span>`
      : ""
  }}
</span>
